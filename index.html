<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finance Calculator</title>
<meta name="theme-color" content="#0B0F14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0B0F14; --surface:#121821; --surface2:#18202B; --line:#222C38; --line2:#2C3846;
  --text:#E9EEF4; --muted:#8C98A8; --faint:#5D6876;
  --green:#22C55E; --green-d:#16A34A; --green-soft:rgba(34,197,94,.14);
  --red:#F05252; --red-soft:rgba(240,82,82,.14);
  --amber:#F5A524; --amber-soft:rgba(245,165,36,.14);
  --radius:18px; --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:26px}
h3{font-size:15px}

/* ---------- buttons & fields ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-weight:600;font-size:16px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:#04140A}
.btn-soft{background:var(--surface2);border:1px solid var(--line)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1px solid rgba(240,82,82,.3)}
.btn-danger.armed{background:var(--red);color:#fff}
.btn-sm{height:38px;width:auto;padding:0 14px;font-size:14px;border-radius:11px}
.link{color:var(--green);font-weight:600;font-size:14px}
.field{display:block;margin:14px 0 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px}
.input{width:100%;height:50px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);font-size:16px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--green)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.error{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.ok{color:var(--green)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 22px}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#16A34A,#22C55E);display:grid;place-items:center;font-size:28px;font-weight:700;color:#04140A;margin:0 auto 14px}
.auth h2{text-align:center;font-size:22px}
.auth p{text-align:center;margin:6px 0 10px;color:var(--muted);font-size:14px}
.auth .alt{display:flex;justify-content:space-between;margin-top:14px}

/* ---------- app shell ---------- */
.app main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.hello{color:var(--muted);font-size:13px;margin-bottom:2px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;margin-bottom:6px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:rgba(11,15,20,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav .brand,.nav .add-desk,.nav .nav-foot{display:none}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);text-decoration:none;cursor:pointer;width:64px}
.nav a svg{width:24px;height:24px}
.nav a.active{color:var(--text)}
.nav a.active svg{color:var(--green)}
.nav a.desk-only{display:none}
.fab{width:58px;height:58px;border-radius:20px;background:var(--green);color:#04140A;font-size:30px;font-weight:500;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 24px rgba(34,197,94,.35),0 0 0 6px var(--bg)}
.fab:active{transform:scale(.95)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- month switch ---------- */
.month{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;height:38px;flex-shrink:0}
.month button{width:34px;height:36px;color:var(--muted);font-size:18px}
.month button:disabled{opacity:.25}
.month span{font-size:13px;font-weight:600;min-width:84px;text-align:center}
.gear{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:16px;flex-shrink:0}
@media (min-width:900px){ .gear{display:none} }

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hero{border-radius:24px;padding:20px;margin-bottom:14px;border:1px solid var(--line);background:radial-gradient(120% 140% at 0% 0%,rgba(34,197,94,.30),transparent 55%),radial-gradient(90% 120% at 100% 100%,rgba(34,197,94,.08),transparent 60%),var(--surface)}
.hero .label{font-size:13px;color:#B9C4D0}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
.big.neg{color:var(--red)}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(11,15,20,.45);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat b{display:block;font-size:18px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.in{background:var(--green)} .dot.out{background:var(--red)}
.today{margin-top:12px;font-size:13px;color:#B9C4D0;display:flex;justify-content:space-between}
.today b{color:var(--text)}

/* donut + legend */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{flex-shrink:0;width:128px;height:128px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .pc{color:var(--muted);width:34px;text-align:right}
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
@media (max-width:520px){
  .donut-wrap{flex-direction:column;align-items:stretch;gap:14px}
  .donut{align-self:center;width:150px;height:150px}
  .lg{font-size:14px}
}
.bars{width:100%;height:auto;display:block}
.keys{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:5px}

/* ---------- transactions ---------- */
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-radius:12px}
.tx:active{background:var(--surface2)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:650;font-size:15px;white-space:nowrap}
.tx-amt.in{color:var(--green)} .tx-amt.out{color:var(--text)}
.day{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 4px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px}
.empty .e{font-size:30px;margin-bottom:6px}

.search{position:relative;margin-bottom:10px}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:15px;width:20px;height:20px;color:var(--faint)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.3)}
.seg button.on.out{color:var(--red)} .seg button.on.in{color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:34px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--green);color:var(--text);background:var(--green-soft)}

/* ---------- clients & debts ---------- */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum3 .stat{background:var(--surface);border-color:var(--line)}
.sum3 b{font-size:16px}
.person{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface2);border:1px solid var(--line2);flex-shrink:0}
.pname{font-weight:650;font-size:16px}
.psub{font-size:12.5px;color:var(--muted)}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.prog.amber i{background:var(--amber)}
.kv{display:flex;justify-content:space-between;font-size:13.5px;margin-top:4px}
.kv .muted{font-size:13px}
.pending{color:var(--amber);font-weight:600}
.paid{color:var(--green);font-weight:600}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:0;white-space:nowrap;padding:0 10px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.review{border-color:rgba(245,165,36,.45);background:linear-gradient(180deg,rgba(245,165,36,.08),transparent 60%),var(--surface)}
.rv{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.rv-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:6px 2px;border-radius:12px}
.rv-main:active{background:var(--surface2)}
.rv-ok{width:44px;height:44px;border-radius:14px;background:var(--green);color:#04140A;font-size:20px;font-weight:700;flex-shrink:0}
.cp{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;margin-top:8px}
.cp-l{font-size:12px;color:var(--muted);flex-shrink:0;width:96px}
.cp-v{flex:1;min-width:0;font-size:13px;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.steps{padding-left:20px;margin:6px 0 4px;line-height:1.55;font-size:14px}
.steps li{margin-bottom:8px}
.nl{position:relative;display:inline-block}
.nbadge{position:absolute;top:-30px;right:-14px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:#1a1205;font-size:11px;font-weight:700;font-style:normal;line-height:18px;text-align:center}
@media (min-width:900px){ .nbadge{top:-2px;right:-26px} }
.person .badge{flex-shrink:0;white-space:nowrap}

/* ---------- more / lists ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:active{background:var(--surface2)}
.li .ico{width:36px;height:36px;font-size:17px;background:var(--surface2)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600}
.li .t small{color:var(--muted);font-size:12.5px}
.li .chev{color:var(--faint);font-size:20px}
.li.danger b{color:var(--red)}
.section-t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 4px 8px}

/* import */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line2);border-radius:var(--radius);padding:26px 14px;text-align:center;color:var(--muted);cursor:pointer}
.drop b{color:var(--text)}
.imp{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--surface2)}
.imp input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.imp .r{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.imp .input{height:42px;font-size:14px}
.imp .d{font-size:13px}

/* ---------- sheet (bottom sheet / dialog) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h h2{font-size:19px}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:18px}
.amount{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:16px 2px 10px;margin-top:6px}
.amount span{font-size:30px;color:var(--muted);font-weight:600}
.amount input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:40px;font-weight:700;letter-spacing:-.02em}
.amount input::placeholder{color:var(--faint)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 9px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-size:11.5px;line-height:1.2;text-align:center;color:var(--muted)}
.cat .em{font-size:22px}
.cat.on{border-color:var(--green);background:var(--green-soft);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:#1F2935;border:1px solid var(--line2);color:var(--text);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .22s ease;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.demo-bar{background:var(--amber-soft);color:var(--amber);font-size:12.5px;text-align:center;padding:8px;border-radius:12px;margin-bottom:12px}

/* ---------- desktop / laptop ---------- */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px;padding:24px 16px;border-top:0;border-right:1px solid var(--line);background:var(--bg)}
  .nav .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:16px}
  .nav .brand .logo{width:36px;height:36px;font-size:18px;border-radius:11px;margin:0}
  .nav .add-desk{display:flex;margin:0 0 14px}
  .nav a{flex-direction:row;gap:12px;width:auto;height:44px;padding:0 12px;border-radius:12px;font-size:14.5px;font-weight:500}
  .nav a.active{background:var(--surface)}
  .nav a.desk-only{display:flex}
  .nav a svg{width:21px;height:21px}
  .nav .fab{display:none}
  .nav .nav-foot{display:block;margin-top:auto;font-size:12px;color:var(--faint);padding:0 8px}
  .app main{max-width:1040px;width:100%;padding:28px 36px 48px}
  .home-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
  .clients-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .clients-grid .card{margin:0}
  .sheet-wrap{align-items:center}
  .sheet{border-radius:24px;border-bottom:1px solid var(--line);max-width:480px;padding-bottom:20px}
  .grab{display:none}
  .toast{bottom:28px}
  .cats{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authScreen" class="auth hidden">
  <div class="auth-card">
    <div class="logo">₹</div>
    <h2 id="authTitle">Welcome back</h2>
    <p id="authSub">Log in to see your money</p>
    <label class="field"><span>Email</span><input id="authEmail" class="input" type="email" autocomplete="email" inputmode="email"></label>
    <label class="field"><span>Password</span><input id="authPass" class="input" type="password" autocomplete="current-password"></label>
    <div id="authError" class="error"></div>
    <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Log in</button>
    <div class="alt">
      <button class="link" id="authSwitch" onclick="toggleAuthMode()">Create an account</button>
      <button class="link" onclick="sendPasswordReset()">Forgot password?</button>
    </div>
  </div>
</div>

<div id="resetScreen" class="auth hidden">
  <div class="auth-card">
    <div class="logo">₹</div>
    <h2>Set a new password</h2>
    <p>Choose a new password for your account</p>
    <label class="field"><span>New password</span><input id="newPassword" class="input" type="password" autocomplete="new-password"></label>
    <div id="resetError" class="error"></div>
    <button class="btn btn-primary" onclick="setNewPassword()">Save new password</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appScreen" class="app hidden">
  <nav class="nav">
    <div class="brand"><div class="logo">₹</div>Finance</div>
    <button class="btn btn-primary btn-sm add-desk" onclick="openTx()">＋ Add transaction</button>
    <a data-view="home" onclick="go('home')"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg><span class="nl">Home<i class="nbadge hidden" id="homeBadge"></i></span></a>
    <a data-view="activity" onclick="go('activity')"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h8"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Activity</a>
    <button class="fab" onclick="openTx()" aria-label="Add transaction">+</button>
    <a data-view="clients" onclick="go('clients')"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.7a3.5 3.5 0 0 1 0 6.6M18.6 14.9c1.5.8 2.5 2.4 2.9 5.1"/></svg>Clients</a>

<script>

// ---------- categories ----------
const OUT_CATS = [
  ["Food","🍽️","#F97316"],["Tea/Coffee","☕","#B45309"],["Cigarettes","🚬","#78716C"],["Fuel","⛽","#EAB308"],
  ["Travel","🚕","#06B6D4"],["Shopping","🛍️","#EC4899"],["Medical","💊","#EF4444"],["Bills","🧾","#8B5CF6"],
  ["EMI/Debt","🏦","#6366F1"],["Camera Gear","📷","#14B8A6"],["Entertainment","🎬","#F43F5E"],["Self Transfer","🔁","#64748B"],

const IN_CATS = [

const NOT_COUNTED = "Self Transfer";   // moving money between your own accounts is not income or spending
function catMeta(name, type){
  const lists = type === "Income" ? [IN_CATS, OUT_CATS] : [OUT_CATS, IN_CATS];
  for(const l of lists){ const c = l.find(x => x[0] === name); if(c) return { name:c[0], icon:c[1], color:c[2] }; }

let filt = { q:"", type:"All", cat:"" };

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(v){ const n = Number(v)||0; return "₹" + Math.abs(n).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
function moneySigned(v){ return (v < 0 ? "−" : "") + money(v); }
function txDate(t){ return new Date(t.created_at || Date.now()); }
function inMonth(t, y, m){ const d = txDate(t); return d.getFullYear() === y && d.getMonth() === m; }
function counted(t){ return t.cat !== NOT_COUNTED; }
function monthName(y, m, short){ return new Date(y, m, 1).toLocaleDateString("en-IN", { month: short ? "short" : "long", year: "numeric" }); }
function isCurrentMonth(){ const n = new Date(); return month.y === n.getFullYear() && month.m === n.getMonth(); }
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function dayLabel(d){
  const t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
  if(ymd(d) === ymd(t)) return "Today";
  if(ymd(d) === ymd(y)) return "Yesterday";
  return d.toLocaleDateString("en-IN", { weekday:"short", day:"numeric", month:"short" });
}
function timeLabel(d){ return d.toLocaleTimeString("en-IN", { hour:"numeric", minute:"2-digit" }); }
function initials(name){
  const w = String(name || "").replace(/[^\p{L}\p{N}\s]/gu, " ").trim().split(/\s+/).filter(Boolean);
  return esc((w.slice(0, 2).map(x => x[0]).join("") || "?").toUpperCase());
}
function clientPaid(c){ return tx.filter(t => t.client_id === c.id && t.type === "Income").reduce((s,t) => s + Number(t.amt), 0); }
function greeting(){ const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }

function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}
// two-tap delete: the first tap arms the button, the second tap within 3 s runs it
function armThen(btn, fn){
  if(btn.dataset.armed){ fn(); return; }
  btn.dataset.armed = "1"; const old = btn.textContent;
  btn.textContent = "Tap again to delete"; btn.classList.add("armed");
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; btn.classList.remove("armed"); }, 3000);
}

// ---------- navigation ----------
function go(v){
  view = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "v-" + v));

}

}
function renderAll(){ renderView(view); updateBadge(); }
function updateBadge(){

  b.textContent = n; b.classList.toggle("hidden", !n);
}
function shiftMonth(n){
  const d = new Date(month.y, month.m + n, 1);
  const lim = new Date(); if(d > new Date(lim.getFullYear(), lim.getMonth(), 1)) return;
  month = { y: d.getFullYear(), m: d.getMonth() }; renderAll();
}
function monthSwitch(){
  return `<div class="month"><button onclick="shiftMonth(-1)" aria-label="Previous month">‹</button><span>${esc(monthName(month.y, month.m, true))}</span><button onclick="shiftMonth(1)" ${isCurrentMonth() ? "disabled" : ""} aria-label="Next month">›</button></div>`;
}

// ---------- auth ----------
function toggleAuthMode(){
  authMode = authMode === "login" ? "signup" : "login";
  const s = authMode === "signup";
  $("authTitle").textContent = s ? "Create your account" : "Welcome back";

  $("authBtn").textContent = s ? "Create account" : "Log in";
  $("authSwitch").textContent = s ? "I have an account" : "Create an account";
  $("authPass").autocomplete = s ? "new-password" : "current-password";
  $("authError").textContent = "";
}
async function handleAuth(){
  const email = $("authEmail").value.trim(), password = $("authPass").value, err = $("authError");
  err.className = "error"; err.textContent = "";
  if(!email || !password){ err.textContent = "Enter your email and password."; return; }
  $("authBtn").disabled = true;
  const r = authMode === "signup" ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  $("authBtn").disabled = false;
  if(r.error){ err.textContent = r.error.message; return; }
  if(authMode === "signup" && !r.data.session){ err.className = "error ok"; err.textContent = "Account created. Check your email to confirm, then log in."; return; }
  await onLoggedIn(r.data.session.user);
}
async function sendPasswordReset(){
  const email = $("authEmail").value.trim(), err = $("authError");
  err.className = "error"; err.textContent = "";
  if(!email){ err.textContent = "Type your email above first, then tap Forgot password."; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if(error){ err.textContent = error.message; return; }
  err.className = "error ok"; err.textContent = "Reset link sent. Open it from your email to set a new password.";
}
async function setNewPassword(){
  const p = $("newPassword").value, err = $("resetError"); err.textContent = "";

// ---------- data ----------
async function loadTx(){
  const { data, error } = await sb.from("transactions").select("*").order("created_at", { ascending: true });
  if(error){ toast("Couldn't load transactions"); console.error(error); return; }
  tx = data || [];
}
async function loadClients(){
  const { data, error } = await sb.from("clients").select("*").order("created_at", { ascending: true });
  if(error){ console.error(error); return; }
  clients = data || [];
}
async function loadOwes(){
  const { data, error } = await sb.from("debts").select("*").order("created_at", { ascending: true });
  if(error){ console.error(error); return; }
  owes = data || [];
}
// The EMI details (type, monthly EMI, due day) and the link from a payment to its loan need two small
// database additions (see supabase/loans.sql). Until they are added, loans work with name, total and paid only.
let hasLoanCols = false, hasDebtLink = false;
async function detectSchema(){
  const [a, b] = await Promise.all([
    sb.from("debts").select("kind,emi_amount,due_day").limit(1),
    sb.from("transactions").select("debt_id").limit(1)]);
  hasLoanCols = !a.error; hasDebtLink = !b.error;
}
// inserts/updates that set the transaction date (created_at); retries without it if the database refuses that column
async function writeTx(op, row, id){
  const run = r => op === "insert" ? sb.from("transactions").insert(r).select() : sb.from("transactions").update(r).eq("id", id).select();
  let res = await run(row);
  if(res.error && /created_at/i.test(res.error.message || "")){
    const r2 = Array.isArray(row) ? row.map(({ created_at, ...x }) => x) : (({ created_at, ...x }) => x)(row);
    res = await run(r2);
  }
  return res;
}

// ======================================================
// HOME
// ======================================================
function monthTotals(y, m){
  let inc = 0, out = 0;
  tx.forEach(t => { if(!inMonth(t, y, m) || !counted(t)) return; if(t.type === "Income") inc += Number(t.amt); else out += Number(t.amt); });
  return { inc, out };
}
function renderHome(){
  const { inc, out } = monthTotals(month.y, month.m);
  const bal = inc - out;
  const todayKey = ymd(new Date());
  const spentToday = tx.filter(t => t.type !== "Income" && counted(t) && ymd(txDate(t)) === todayKey).reduce((s,t) => s + Number(t.amt), 0);
  const recent = tx.slice().sort((a,b) => txDate(b) - txDate(a)).slice(0, 6);
  const pendingTotal = clients.reduce((s,c) => s + Math.max(0, Number(c.total_amount) - clientPaid(c)), 0);
  const pendingCount = clients.filter(c => Number(c.total_amount) - clientPaid(c) > 0).length;
  const oweTotal = owes.reduce((s,o) => s + Math.max(0, Number(o.total_amount) - Number(o.paid_amount)), 0);

  $("v-home").innerHTML = `
    <header class="top">
      <div><div class="hello">${greeting()}</div><h1>Overview</h1></div>
      <div style="display:flex;gap:8px;align-items:center">${monthSwitch()}<button class="gear" onclick="go('more')" aria-label="Settings">⚙️</button></div>
    </header>
    ${reviewCardHtml()}
    <div class="home-grid">
      <div>
        <div class="hero">
          <div class="label">Balance this month</div>
          <div class="big ${bal < 0 ? "neg" : ""}">${moneySigned(bal)}</div>
          <div class="hero-stats">
            <div class="stat"><div class="k"><span class="dot in"></span>Money in</div><b>${money(inc)}</b></div>
            <div class="stat"><div class="k"><span class="dot out"></span>Money out</div><b>${money(out)}</b></div>
          </div>
          ${isCurrentMonth() ? `<div class="today"><span>Spent today</span><b>${money(spentToday)}</b></div>` : ""}
        </div>
        <div class="card">
          <div class="card-h"><h3>Where your money went</h3><span class="muted" style="font-size:13px">${esc(monthName(month.y, month.m, true))}</span></div>
          ${donutHtml()}
        </div>
        <div class="card">
          <div class="card-h"><h3>Last 6 months</h3><div class="keys"><span><i class="dot in"></i>In</span><span><i class="dot out"></i>Out</span></div></div>
          ${barsHtml()}
        </div>
      </div>
      <div>
        <div class="card">
          <div class="card-h"><h3>Recent</h3>${tx.length ? `<button class="link" onclick="go('activity')">See all</button>` : ""}</div>
          ${recent.length ? recent.map(t => txRow(t, "day")).join("") : emptyHtml("🧾", "No transactions yet. Tap + to add your first one.")}
        </div>
        <button class="card" style="display:block;width:100%;text-align:left" onclick="go('clients')">
          <div class="card-h" style="margin-bottom:6px"><h3>To receive from clients</h3><span class="chev muted">›</span></div>
          <div style="font-size:24px;font-weight:700" class="${pendingTotal > 0 ? "pending" : ""}">${money(pendingTotal)}</div>
          <div class="muted" style="font-size:13px">${pendingCount ? pendingCount + " client" + (pendingCount > 1 ? "s" : "") + " with money pending" : clients.length ? "Everyone has paid in full" : "Add clients to track what they owe you"}</div>
        </button>
        <button class="card" style="display:block;width:100%;text-align:left" onclick="go('loans')">
          <div class="card-h" style="margin-bottom:6px"><h3>Loans & EMIs left to pay</h3><span class="chev muted">›</span></div>
          <div style="font-size:24px;font-weight:700">${money(oweTotal)}</div>
          <div class="muted" style="font-size:13px">${nextDueLine()}</div>
        </button>
      </div>
    </div>`;
}
function donutHtml(){
  const by = {};
  tx.forEach(t => { if(t.type === "Income" || !counted(t) || !inMonth(t, month.y, month.m)) return; by[t.cat] = (by[t.cat] || 0) + Number(t.amt); });
  let rows = Object.entries(by).sort((a,b) => b[1] - a[1]);
  const total = rows.reduce((s,r) => s + r[1], 0);
  if(!total) return emptyHtml("🍩", "No spending in " + monthName(month.y, month.m) + " yet.");
  if(rows.length > 6){ const rest = rows.slice(5).reduce((s,r) => s + r[1], 0); rows = rows.slice(0,5).concat([["More", rest]]); }
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const segs = rows.map(([name, v]) => {
    const col = name === "More" ? "#475569" : catMeta(name).color;
    const len = v / total * C, gap = rows.length > 1 ? 2 : 0;
    const s = `<circle r="${R}" cx="64" cy="64" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)"/>`;
    off += len; return s;
  }).join("");
  const legend = rows.map(([name, v]) => {
    const col = name === "More" ? "#475569" : catMeta(name).color;
    return `<div class="lg"><i class="sw" style="background:${col}"></i><span class="nm">${esc(name)}</span><b>${money(v)}</b><span class="pc">${Math.round(v / total * 100)}%</span></div>`;
  }).join("");
  return `<div class="donut-wrap">
    <svg class="donut" viewBox="0 0 128 128"><circle r="${R}" cx="64" cy="64" fill="none" stroke="#18202B" stroke-width="16"/>${segs}
      <text x="64" y="60" text-anchor="middle" fill="#8C98A8" font-size="10">Spent</text>
      <text x="64" y="76" text-anchor="middle" fill="#E9EEF4" font-size="14" font-weight="700">${esc(money(total))}</text></svg>
    <div class="legend">${legend}</div></div>`;
}
function barsHtml(){
  const months = [];
  for(let i = 5; i >= 0; i--){ const d = new Date(month.y, month.m - i, 1); months.push({ y:d.getFullYear(), m:d.getMonth(), ...monthTotals(d.getFullYear(), d.getMonth()) }); }
  const max = Math.max(1, ...months.map(x => Math.max(x.inc, x.out)));
  const W = 320, H = 150, base = 120, top = 14, gw = W / 6, bw = 14;
  const bars = months.map((x, i) => {
    const cx = gw * i + gw / 2, hi = (base - top) * x.inc / max, ho = (base - top) * x.out / max;
    const sel = i === 5;
    return `<rect x="${cx - bw - 2}" y="${base - hi}" width="${bw}" height="${Math.max(hi, 1.5)}" rx="4" fill="#22C55E" opacity="${sel ? 1 : .55}"/>
      <rect x="${cx + 2}" y="${base - ho}" width="${bw}" height="${Math.max(ho, 1.5)}" rx="4" fill="#F05252" opacity="${sel ? 1 : .55}"/>
      <text x="${cx}" y="${base + 20}" text-anchor="middle" font-size="11" fill="${sel ? "#E9EEF4" : "#8C98A8"}" font-weight="${sel ? 700 : 400}">${new Date(x.y, x.m, 1).toLocaleDateString("en-IN", { month:"short" })}</text>`;
  }).join("");
  return `<svg class="bars" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#222C38"/>${bars}</svg>`;
}
function emptyHtml(e, text){ return `<div class="empty"><div class="e">${e}</div>${esc(text)}</div>`; }
// mode: "time" inside day groups (Activity), "day" for Recent (Today / Yesterday / 21 Nov), "date" for loan history
function txRow(t, mode){
  const c = catMeta(t.cat, t.type), d = txDate(t), cl = clients.find(x => x.id === t.client_id);
  const when = mode === "date" ? d.toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" })
             : mode === "day" ? dayLabel(d) + ", " + timeLabel(d) : timeLabel(d);
  const sub = [t.note && t.note !== "No description" ? t.note : "", cl ? cl.name : "", when].filter(Boolean).join(" · ");
  const inc = t.type === "Income";
  return `<button class="tx" onclick="openTx('${esc(t.id)}')">
    <span class="ico" style="background:${c.color}22">${c.icon}</span>
    <span class="tx-main"><span class="tx-title">${esc(t.cat)}</span><span class="tx-sub">${esc(sub)}</span></span>
    <span class="tx-amt ${inc ? "in" : "out"}">${inc ? "+" : "−"}${money(t.amt)}</span></button>`;
}

function renderActivity(){
  const cats = [...new Set(tx.filter(t => inMonth(t, month.y, month.m)).map(t => t.cat))];
  $("v-activity").innerHTML = `
    <header class="top"><div><div class="hello">All transactions</div><h1>Activity</h1></div>${monthSwitch()}</header>
    <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

    <div class="seg">${["All","Expense","Income"].map(k => `<button class="${filt.type === k ? "on " + (k === "Expense" ? "out" : k === "Income" ? "in" : "") : ""}" onclick="filt.type='${k}';renderActivity()">${k === "All" ? "All" : k === "Expense" ? "Money out" : "Money in"}</button>`).join("")}</div>

    <div id="actList"></div>`;
  renderActivityList();
}
function renderActivityList(){
  const q = filt.q.trim().toLowerCase();
  const rows = tx.filter(t => inMonth(t, month.y, month.m))
    .filter(t => filt.type === "All" || t.type === filt.type)
    .filter(t => !filt.cat || t.cat === filt.cat)
    .filter(t => { if(!q) return true; const cl = clients.find(x => x.id === t.client_id); return [t.note, t.cat, cl && cl.name, String(t.amt)].some(s => String(s || "").toLowerCase().includes(q)); })
    .sort((a,b) => txDate(b) - txDate(a));
  const el = $("actList");
  if(!rows.length){ el.innerHTML = emptyHtml("🔍", tx.length ? "Nothing matches in " + monthName(month.y, month.m) + "." : "No transactions yet. Tap + to add one."); return; }
  const groups = {};
  rows.forEach(t => { const k = ymd(txDate(t)); (groups[k] = groups[k] || []).push(t); });
  el.innerHTML = Object.entries(groups).map(([k, list]) => {
    const net = list.reduce((s,t) => s + (counted(t) ? (t.type === "Income" ? 1 : -1) * Number(t.amt) : 0), 0);
    return `<div class="day"><span>${esc(dayLabel(txDate(list[0])))}</span><span>${net >= 0 ? "+" : "−"}${money(net)}</span></div>` + list.map(t => txRow(t, "time")).join("");
  }).join("");
}

  $("txCats").innerHTML = list.map(([n, ic]) => `<button class="cat ${f.cat === n ? "on" : ""}" onclick="txForm.cat=${esc(JSON.stringify(n))};paintTxForm()"><span class="em">${ic}</span>${esc(n)}</button>`).join("");

    </div>`;
}
function setTxType(type){
  txForm.type = type;
  const list = type === "Income" ? IN_CATS : OUT_CATS;
  if(!list.some(c => c[0] === txForm.cat)) txForm.cat = "";
  paintTxForm();
}
async function saveTx(){
  const f = txForm;
  const amt = parseFloat(String($("txAmt").value).replace(/[^\d.]/g, ""));
  if(!amt || amt <= 0){ toast("Enter an amount"); $("txAmt").focus(); return; }
  if(!f.cat){ toast("Pick a category"); return; }
  const dv = $("txDate").value || ymd(new Date());
  const isInc = f.type === "Income";
  const row = { type: f.type, cat: f.cat, note: $("txNote").value.trim() || "No description", amt,
                client_id: isInc ? (f.client || null) : null, payment_type: isInc ? f.pay : null };
  if(!f.id || dv !== f.origDate){
    const [y, m, d] = dv.split("-").map(Number);
    row.created_at = (dv === ymd(new Date()) ? new Date() : new Date(y, m - 1, d, 12, 0, 0)).toISOString();
  }
  $("txSave").disabled = true;
  const old = f.id ? tx.find(x => x.id === f.id) : null, oldAmt = old ? Number(old.amt) : 0;
  let res;
  if(f.id) res = await writeTx("update", row, f.id);
  else res = await writeTx("insert", { ...row, user_id: currentUser.id });
  $("txSave").disabled = false;
  if(res.error){ toast("Couldn't save: " + res.error.message); return; }
  if(f.id){ const i = tx.findIndex(x => x.id === f.id); if(i >= 0) tx[i] = res.data[0]; }
  else tx.push(res.data[0]);
  if(old && old.debt_id && amt !== oldAmt) await adjustLoanPaid(old.debt_id, amt - oldAmt);
  closeSheet(); renderAll();
  toast(f.id ? "Saved" : (isInc ? "Money in added · " : "Money out added · ") + money(amt));
}
async function deleteTx(id){
  const t = tx.find(x => x.id === id);
  const { error } = await sb.from("transactions").delete().eq("id", id);
  if(error){ toast("Couldn't delete: " + error.message); return; }
  tx = tx.filter(x => x.id !== id);
  if(t && t.debt_id) await adjustLoanPaid(t.debt_id, -Number(t.amt));
  closeSheet(); renderAll(); toast(t && t.debt_id ? "Payment deleted · loan balance updated" : "Transaction deleted");
}

// LOANS & EMIs
// ======================================================
const LOAN_KINDS = [["EMI","🗓️"],["Loan","🏦"],["Borrowed","🤝"],["Credit card","💳"],["Other","📄"]];
const num = v => parseFloat(String(v ?? "").replace(/[^\d.]/g, "")) || 0;
function loanKind(o){ const k = (hasLoanCols && o.kind) || "Loan"; return LOAN_KINDS.find(x => x[0] === k) || LOAN_KINDS[1]; }
function loanLeft(o){ return Math.max(0, Number(o.total_amount) - Number(o.paid_amount)); }
// payments made towards a loan: linked by debt_id, or (before the database update) by the "EMI · name" note
function loanPayments(o){
  return tx.filter(t => hasDebtLink ? t.debt_id === o.id
                                    : (t.cat === "EMI/Debt" && / · /.test(t.note || "") && String(t.note).endsWith(" · " + o.name)))
           .sort((a,b) => txDate(b) - txDate(a));
}
function paidThisMonth(o){ const n = new Date(); return loanPayments(o).filter(t => inMonth(t, n.getFullYear(), n.getMonth())).reduce((s,t) => s + Number(t.amt), 0); }
// next due date from the due day; once this month's EMI is paid, the next one is next month
function nextDue(o){
  const day = hasLoanCols ? Number(o.due_day) : 0;
  if(!day || loanLeft(o) <= 0) return null;
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  const at = (yy, mm) => new Date(yy, mm, Math.min(day, new Date(yy, mm + 1, 0).getDate()));
  const paidNow = paidThisMonth(o) > 0;
  const addedAfterDue = o.created_at && new Date(o.created_at) > at(y, m);   // a loan added after this month's due date starts next month
  const due = paidNow || addedAfterDue ? at(y, m + 1) : at(y, m);
  const days = Math.round((due - new Date(y, m, n.getDate())) / 864e5);
  return { due, days, paidNow, overdue: !paidNow && days < 0 };
}
function dueText(nd){
  if(!nd) return "";
  if(nd.overdue) return `Overdue by ${-nd.days} day${nd.days === -1 ? "" : "s"}`;
  if(nd.days === 0) return "Due today";
  if(nd.days === 1) return "Due tomorrow";
  return "Due " + nd.due.toLocaleDateString("en-IN", { day:"numeric", month:"short" }) + (nd.days <= 7 ? ` · in ${nd.days} days` : "");
}
function nextDueLine(){
  const open = owes.filter(o => loanLeft(o) > 0);
  if(!open.length) return owes.length ? "All loans cleared 🎉" : "Add your loans and EMIs to track what's left";
  const soon = open.map(o => ({ o, nd: nextDue(o) })).filter(x => x.nd && !x.nd.paidNow).sort((a,b) => a.nd.due - b.nd.due)[0];
  if(soon) return `Next: ${esc(soon.o.name)}${soon.o.emi_amount ? " " + money(soon.o.emi_amount) : ""} · ${esc(dueText(soon.nd))}`;
  return open.length + " open loan" + (open.length > 1 ? "s" : "");
}
function dueKey(o){ const nd = nextDue(o); return nd ? nd.due.getTime() : Infinity; }

function renderLoans(){
  const open = owes.filter(o => loanLeft(o) > 0).sort((a,b) => dueKey(a) - dueKey(b));
  const closed = owes.filter(o => loanLeft(o) <= 0);
  const left = owes.reduce((s,o) => s + loanLeft(o), 0);
  const emiMonth = open.reduce((s,o) => s + (hasLoanCols ? Number(o.emi_amount) || 0 : 0), 0);
  const paidMonth = owes.reduce((s,o) => s + paidThisMonth(o), 0);
  $("v-loans").innerHTML = `
    <header class="top"><div><div class="hello">What you still have to pay</div><h1>Loans & EMIs</h1></div><button class="btn btn-primary btn-sm" onclick="openLoan()">＋ Add</button></header>
    <div class="hero" style="background:radial-gradient(120% 140% at 0% 0%,rgba(245,165,36,.24),transparent 55%),var(--surface)">
      <div class="label">Left to pay</div>
      <div class="big">${money(left)}</div>
      <div class="hero-stats">
        <div class="stat"><div class="k">EMIs each month</div><b>${hasLoanCols ? money(emiMonth) : "–"}</b></div>
        <div class="stat"><div class="k">Paid this month</div><b class="paid">${money(paidMonth)}</b></div>
      </div>
    </div>
    ${!hasLoanCols ? `<div class="demo-bar">Monthly EMI and due dates switch on after a one-time database update.</div>` : ""}
    ${open.length ? `<div class="clients-grid">${open.map(loanCard).join("")}</div>`
      : `<div class="card">${emptyHtml("🎉", owes.length ? "Everything is paid off." : "No loans or EMIs yet. Add one to see what's left to pay.")}<button class="btn btn-soft" onclick="openLoan()">Add a loan or EMI</button></div>`}
    ${closed.length ? `<div class="section-t">Paid off</div><div class="list">${closed.map(o => `<button class="li" onclick="openLoanDetail('${esc(o.id)}')"><span class="ico">${loanKind(o)[1]}</span><span class="t"><b>${esc(o.name)}</b><small>${money(o.total_amount)} cleared</small></span><span class="chev">›</span></button>`).join("")}</div>` : ""}`;
}
function loanCard(o){
  const total = Number(o.total_amount), paid = Number(o.paid_amount), left = loanLeft(o);
  const pct = total > 0 ? Math.min(100, Math.round(paid / total * 100)) : 0;
  const emi = hasLoanCols ? Number(o.emi_amount) || 0 : 0;
  const nd = nextDue(o), k = loanKind(o);
  const emisLeft = emi ? Math.ceil(left / emi) : 0;
  const meta = [emi ? money(emi) + "/month" : "", emisLeft ? emisLeft + " EMI" + (emisLeft > 1 ? "s" : "") + " left" : "", o.note || ""].filter(Boolean).join(" · ");
  const badge = !nd ? `<span class="badge amber">Open</span>`
    : nd.overdue ? `<span class="badge red">${esc(dueText(nd))}</span>`
    : nd.paidNow ? `<span class="badge">✓ Paid this month</span>`
    : `<span class="badge amber">${esc(dueText(nd))}</span>`;
  return `<div class="card">
    <button class="person" style="width:100%;text-align:left" onclick="openLoanDetail('${esc(o.id)}')">
      <div class="avatar" style="font-size:19px">${k[1]}</div>
      <div style="flex:1;min-width:0"><div class="pname">${esc(o.name)}</div><div class="psub">${esc(meta || k[0])}</div><div style="margin-top:7px">${badge}</div></div></button>
    <div class="prog amber"><i style="width:${pct}%"></i></div>
    <div class="kv"><span class="muted">Paid ${money(paid)} of ${money(total)}</span><span class="pending">${money(left)} left</span></div>
    ${nd && nd.paidNow ? `<div class="kv"><span class="muted">Next EMI</span><span>${esc(dueText(nd))}</span></div>` : ""}
    <div class="actions">
      <button class="btn btn-primary btn-sm" onclick="openPay('${esc(o.id)}')">${emi ? "Pay EMI " + money(Math.min(emi, left)) : "Log a payment"}</button>
      <button class="btn btn-soft btn-sm" onclick="openLoanDetail('${esc(o.id)}')">Details</button>
    </div></div>`;
}

async function savePay(id){

// saves a payment towards a loan: one EMI/Debt transaction (linked to the loan) + the loan's paid amount, kept in step
async function recordLoanPayment(o, amt, createdAt, extra){
  const emi = hasLoanCols ? Number(o.emi_amount) || 0 : 0;
  const row = { user_id: currentUser.id, type: "Expense", cat: "EMI/Debt", amt, client_id: null, payment_type: null,
    note: [(emi && Math.abs(amt - emi) < 0.01 ? "EMI" : "Repayment") + " · " + o.name, extra].filter(Boolean).join(" · "), created_at: createdAt };
  if(hasDebtLink) row.debt_id = o.id;
  const r = await writeTx("insert", row);
  if(r.error){ toast("Couldn't save: " + r.error.message); return false; }
  const u = await sb.from("debts").update({ paid_amount: Math.min(Number(o.total_amount), Number(o.paid_amount) + amt) }).eq("id", o.id).select();
  if(u.error){                                        // undo the payment if the loan didn't update
    await sb.from("transactions").delete().eq("id", r.data[0].id);
    toast("Couldn't save: " + u.error.message); return false;
  }
  tx.push(r.data[0]); Object.assign(o, u.data[0]);
  return true;
}
// editing or deleting a payment that belongs to a loan moves the loan's paid amount with it
async function adjustLoanPaid(debtId, delta){
  const o = owes.find(x => x.id === debtId); if(!o || !delta) return;
  const v = Math.max(0, Math.min(Number(o.total_amount), Number(o.paid_amount) + delta));
  const { data, error } = await sb.from("debts").update({ paid_amount: v }).eq("id", debtId).select();
  if(!error && data && data[0]) Object.assign(o, data[0]);
}

function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(); };
    s.onerror = rej; document.head.appendChild(s);
  });
}
function getPageLines(content){
  const lines = {};
  content.items.forEach(item => { const y = Math.round(item.transform[5]); (lines[y] = lines[y] || []).push(item.str); });
  return Object.keys(lines).map(Number).sort((a,b) => b - a).map(y => lines[y].join(" ").trim()).filter(Boolean);
}
async function handlePdfUpload(event){
  const file = event.target.files[0]; if(!file) return;
  $("pdfPasswordFields").classList.add("hidden");
  $("importStatus").textContent = "Reading PDF…";
  $("importBtn").classList.add("hidden"); $("importPreview").innerHTML = "";
  pendingPdfBuffer = await file.arrayBuffer();
  await loadPdfAndParse(pendingPdfBuffer, null);
}
async function retryPdfWithPassword(){
  const p = $("pdfPassword").value; if(!p || !pendingPdfBuffer) return;
  $("importStatus").textContent = "Unlocking PDF…";
  await loadPdfAndParse(pendingPdfBuffer, p);

async function loadPdfAndParse(buf, password){
  const st = $("importStatus");
  try{
    await loadPdfJs();
    const opts = { data: buf.slice(0) }; if(password) opts.password = password;
    const pdf = await pdfjsLib.getDocument(opts).promise;
    $("pdfPasswordFields").classList.add("hidden");
    let all = [];
    for(let i = 1; i <= pdf.numPages; i++){ const page = await pdf.getPage(i); all = all.concat(getPageLines(await page.getTextContent())); }
    const parsed = parseStatementLines(all);
    if(!parsed.length){ st.textContent = "Couldn't find transactions in this PDF automatically. You can still add them with the + button."; return; }
    st.textContent = `${parsed.length} transaction(s) found. Untick or fix anything that looks wrong, then import.`;
    renderImportPreview(parsed); $("importBtn").classList.remove("hidden");
  }catch(err){
    if(err && err.name === "PasswordException"){
      $("pdfPasswordFields").classList.remove("hidden");
      st.textContent = password ? "That password didn't work. Try again." : "This PDF is password-protected. Enter the password below.";
    } else { st.textContent = "Couldn't read this PDF. It may be damaged or in a format we don't support."; console.error(err); }
  }
}
function guessCategory(desc, type){
  const d = (desc || "").toLowerCase();
  const rules = [
    ["Cigarettes", ["cigarette","cigar","tobacco","panwala","pan shop","gutkha"]],
    ["Tea/Coffee", ["tea stall","chai","coffee","starbucks","ccd","cafe coffee","tea point"]],
    ["Fuel", ["petrol","diesel","fuel","hpcl","iocl","bpcl","indian oil","hindustan petroleum","bharat petroleum","shell","filling station","petroleum"]],
    ["Food", ["swiggy","zomato","restaurant","food","eatery","dine","dhaba","biryani","hotel","kitchen","foods","bakery","sweets"]],
    ["Medical", ["pharmacy","hospital","medical","clinic","medicine","apollo","chemist","diagnostic","health"]],
    ["Travel", ["uber","ola","irctc","railway","train","flight","indigo","airlines","redbus","cab","travels","metro","toll","parking"]],
    ["Bills", ["recharge","electricity","broadband","wifi","dth","postpaid","prepaid","gas bill","water bill","utility"]],
    ["EMI/Debt", ["emi","loan","installment","lending","credit card bill"]],
    ["Camera Gear", ["camera","lens","tripod","gimbal","photography","videography"]],
    ["Entertainment", ["netflix","spotify","prime video","bookmyshow","movie","cinema","hotstar","youtube premium","gaming"]],
    ["Shopping", ["amazon","flipkart","myntra","mall","store","mart","supermarket","shopping","reliance trends","dmart"]],
  ];
  for(const [cat, words] of rules) if(words.some(w => d.includes(w))) return cat;
  return type === "Income" ? "Freelance Payment" : "Other";
}
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
// "Jan 01, 2026", "01 Jan 2026", "01/01/2026", "01-01-26" (day first) or "2026-01-01" → Date at noon, or null
function parseDateStr(s){
  if(!s) return null; s = s.trim(); let y, m, d, x;
  if((x = s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/))){ m = MONTHS.indexOf(x[1].slice(0,3).toLowerCase()); d = +x[2]; y = +x[3]; }
  else if((x = s.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})$/))){ d = +x[1]; m = MONTHS.indexOf(x[2].slice(0,3).toLowerCase()); y = +x[3]; }
  else if((x = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/))){ y = +x[1]; m = +x[2] - 1; d = +x[3]; }
  else if((x = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){ d = +x[1]; m = +x[2] - 1; y = +x[3]; if(y < 100) y += 2000; }
  if(m == null || m < 0 || !y || !d) return null;
  const dt = new Date(y, m, d, 12, 0, 0);
  return isNaN(dt) || dt > new Date() ? null : dt;
}
function parseStatementLines(lines){
  const dateRegex = /^(?:[A-Za-z]{3,9}\.?\s+\d{1,2},?\s+\d{4}|\d{1,2}\s+[A-Za-z]{3,9}\.?,?\s+\d{4}|\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2})$/;
  const amountRegex = /(?:₹|Rs\.?|INR)\s?([\d,]+(?:\.\d{1,2})?)|\b([\d,]+\.\d{2})\s?(?:Dr|Cr|DR|CR)\b/;
  const results = []; let currentDate = null, buffer = [];
  function flush(){
    if(!buffer.length) return;
    const block = buffer.join(" "), am = block.match(amountRegex);
    if(am){
      const amount = parseFloat((am[1] || am[2]).replace(/,/g, ""));
      let type = "Expense";
      if(/\bcr\b|credited|credit(?!ed to)|received|deposit/i.test(block)) type = "Income";
      if(/\bdr\b|debited|debit|paid|withdrawal|payment to|sent/i.test(block)) type = "Expense";
      let desc = block.replace(amountRegex, "")
        .replace(/\b(debit|credit(ed)?|received|paid to|paid|withdrawal|deposit|dr|cr|transaction id.*$|ref no.*$|utr.*$)\b/gi, "")
        .replace(/\s+/g, " ").trim().slice(0, 60) || "Imported transaction";
      if(amount > 0) results.push({ date: currentDate, when: parseDateStr(currentDate), type, amount, desc, cat: guessCategory(desc, type) });
    }
    buffer = [];
  }
  lines.forEach(line => { if(dateRegex.test(line)){ flush(); currentDate = line; } else { buffer.push(line); if(amountRegex.test(line)) flush(); } });
  flush();
  return results;
}
function renderImportPreview(rows){

          <input class="input" id="imp-amt-${i}" inputmode="decimal" value="${esc(r.amount)}">

}
async function importSelected(){

}

// ======================================================
// PAYMENTS FROM BANK SMS
// The iPhone automation (1) drops each Kotak / Union SMS into your private inbox (works even when the phone is
// locked) and (2) opens  <site>/#sms=<the SMS text>  so you can categorize it right away if you have a moment.
// Anything you don't categorize waits under "To review" on Home and is not counted until you approve it.
// ======================================================
// Kotak: "Sent Rs.205.00 from Kotak Bank A/c X1234 to NAME on 23-11-26. UPI Ref 9865..."
//        "Received Rs.10000.00 in your Kotak Bank AC 1234 from NAME on 20-11-26.UPI Ref:6349..."
// Union: "Union Bank of India A/c*1234 Dr Rs3500.00 on 23-11-26 11:43 by MB 1332... Fv.NAME, Bal Rs..."
//        "A/c *1234 Credited for Rs:10000.00 on 23-11-2026 11:40:43 by Mob Bk ref no 6327... Avl Bal Rs:..."
function parseBankSms(sms){
  const t = String(sms || "").replace(/\s+/g, " ").trim();
  const out = { type: "", amount: 0, party: "", account: "", ref: "", text: t };
  if(!t) return out;
  // keep only the transaction part: drop balance, fraud warnings and links
  const body = t.split(/\b(?:Not done by you|Not U\?|Not you|If not you|Avl\.? Bal|Bal(?:ance)? Rs|Never Share|https?:\/\/)/i)[0];
  const outAt = body.search(/\b(?:sent|debited|paid|spent|withdrawn|dr)\b/i);
  const inAt = body.search(/\b(?:received|credited|deposited|cr)\b/i);
  if(outAt >= 0 && (inAt < 0 || outAt < inAt)) out.type = "Expense"; else if(inAt >= 0) out.type = "Income";
  const m = body.match(/(?:rs|inr|₹)\s*[.:]?\s*([\d,]+(?:\.\d{1,2})?)/i);
  if(m) out.amount = parseFloat(m[1].replace(/,/g, ""));
  if(/kotak/i.test(t)) out.account = "Kotak"; else if(/union bank/i.test(t)) out.account = "Union";
  const r = body.match(/(?:UPI\s*Ref(?:\s*No)?|Ref\s*No|RefNo|Ref)\s*[:.#]?\s*(\d{6,})/i) ||
            body.match(/\bby\s+(?:MB|Mob\s*Bk|UPI|IMPS|NEFT)\s+(?:ref\s*no\s*)?(\d{6,})/i) || body.match(/\b(\d{12})\b/);
  if(r) out.ref = r[1];
  const tries = out.type === "Income"
    ? [/\bfrom\s+(?:VPA\s+)?(.+?)\s+on\s+\d/i, /\bfrom\s+(?:VPA\s+)?([^.,;]+)/i]
    : [/\bto\s+(?:VPA\s+)?(.+?)\s+on\s+\d/i, /\bby\s+(?:MB|UPI|IMPS|NEFT)\s+\d{6,}\s+([^,]+)/i, /;\s*(.+?)\s+credited/i, /\btrf to\s+(.+?)\s+ref/i, /\bto\s+(?:VPA\s+)?([^.,;]+)/i];
  for(const re of tries){ const x = body.match(re); if(x && !/^\d+$/.test(x[1].trim())){ out.party = x[1]; break; } }
  out.party = out.party.replace(/^(?:Fv|Fav|Favour)[.:\s]+/i, "").replace(/[.\s]+$/, "").trim();
  return out;
}
function titleCase(s){ return String(s || "").toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()); }
function matchClient(p){
  const lower = titleCase(p.party).toLowerCase();
  if(p.type !== "Income" || !lower) return null;
  const first = lower.split(" ")[0];
  return clients.find(c => { const n = String(c.name).toLowerCase(); return n.includes(lower) || lower.includes(n) || (first.length > 2 && n.includes(first)); }) || null;
}
function suggestCat(p){
  if(p.type === "Income") return matchClient(p) ? "Freelance Payment" : (p.party ? guessCategory(titleCase(p.party), "Income") : "Other");
  return p.party ? guessCategory(titleCase(p.party), "Expense") : "Other";
}

// ---------- inbox (needs supabase/sms_inbox.sql) ----------
let inbox = [], hasInbox = false;
async function loadInbox(){
  const { data, error } = await sb.from("sms_inbox").select("*").order("received_at", { ascending: true });
  hasInbox = !error; inbox = error ? [] : (data || []);
}
function inboxItems(){
  return inbox.map(i => ({ i, p: parseBankSms(i.sms), when: new Date(i.received_at) })).filter(x => x.p.amount > 0 && x.p.type);
}
async function removeInbox(ids){
  ids = ids.filter(Boolean); if(!ids.length) return;
  for(const id of ids) await sb.from("sms_inbox").delete().eq("id", id);
  inbox = inbox.filter(i => !ids.includes(i.id));
}
function inboxIdsFor(ref, id){ return inbox.filter(i => i.id === id || (ref && i.ref === ref)).map(i => i.id); }

function reviewCardHtml(){
  const items = inboxItems();
  if(!items.length) return "";
  const out = items.filter(x => x.p.type === "Expense").reduce((s,x) => s + x.p.amount, 0);
  const inc = items.filter(x => x.p.type === "Income").reduce((s,x) => s + x.p.amount, 0);
  return `<div class="card review">
    <div class="card-h"><h3>📥 ${items.length} payment${items.length > 1 ? "s" : ""} to review</h3>
      ${items.length > 1 ? `<button class="link" onclick="approveAll()">Approve all</button>` : ""}</div>
    <div class="muted" style="font-size:13px;margin:-6px 2px 4px">${[out ? money(out) + " out" : "", inc ? money(inc) + " in" : ""].filter(Boolean).join(" · ")}, from your bank SMS. Not counted until you approve.</div>
    ${items.map(reviewRow).join("")}
  </div>`;
}
function reviewRow({ i, p, when }){
  const cat = suggestCat(p), c = catMeta(cat, p.type), isIn = p.type === "Income";
  return `<div class="rv">
    <button class="rv-main" onclick="reviewInbox('${esc(i.id)}')">
      <span class="ico" style="background:${c.color}22">${c.icon}</span>
      <span class="tx-main"><span class="tx-title"><span class="${isIn ? "paid" : ""}">${isIn ? "+" : "−"}${money(p.amount)}</span> · ${esc(titleCase(p.party) || (isIn ? "Money in" : "Payment"))}</span>
        <span class="tx-sub">${esc(cat)} · ${esc(p.account || "Bank")} · ${esc(dayLabel(when))}, ${esc(timeLabel(when))}</span></span>
    </button>
    <button class="rv-ok" onclick="approveInbox('${esc(i.id)}')" aria-label="Approve">✓</button>
  </div>`;
}
function needsChoice(p){ return suggestCat(p) === "EMI/Debt" && owes.some(o => loanLeft(o) > 0); }
async function approveInbox(id, quiet){
  const x = inboxItems().find(y => y.i.id === id); if(!x) return false;
  if(needsChoice(x.p)){ reviewInbox(id); return false; }               // an EMI needs you to pick the loan
  const cat = suggestCat(x.p), cl = matchClient(x.p), isIn = x.p.type === "Income";
  const row = { user_id: currentUser.id, type: x.p.type, cat, amt: x.p.amount,
                note: [titleCase(x.p.party), x.p.account].filter(Boolean).join(" · ") || "From bank SMS",
                client_id: isIn && cl ? cl.id : null, payment_type: isIn ? "Full" : null, created_at: x.when.toISOString() };
  const r = await writeTx("insert", row);
  if(r.error){ toast("Couldn't save: " + r.error.message); return false; }
  tx.push(r.data[0]); await removeInbox([id]);
  if(!quiet){ renderAll(); toast(`Approved ${money(x.p.amount)} · ${cat}`); }
  return true;
}
async function approveAll(){
  let n = 0, skipped = 0;
  for(const x of inboxItems()){
    if(needsChoice(x.p)){ skipped++; continue; }
    if(await approveInbox(x.i.id, true)) n++;
  }
  renderAll();
  toast(`${n} approved` + (skipped ? ` · ${skipped} EMI${skipped > 1 ? "s" : ""} left to match with a loan` : ""));
}
function reviewInbox(id){
  const x = inboxItems().find(y => y.i.id === id); if(!x) return;
  openSmsSheet(x.p, { inboxId: id, when: x.when });
}

// ---------- the quick-save sheet (from the SMS link, or Edit in To review) ----------
let smsForm = null;
function openSmsFromHash(){
  let raw = location.hash.slice(5);
  if(!/%20/.test(raw)) raw = raw.replace(/\+/g, " ");
  try{ raw = decodeURIComponent(raw); }catch(e){}
  history.replaceState(null, "", location.pathname + location.search);   // so a reload doesn't open it again
  const p = parseBankSms(raw);
  if(!p.amount || !p.type){ toast("That SMS doesn't look like a payment"); return; }
  const queued = inbox.find(i => p.ref && i.ref === p.ref);              // the automation already put it in the inbox
  openSmsSheet(p, { inboxId: queued ? queued.id : null, when: queued ? new Date(queued.received_at) : new Date() });
}
window.addEventListener("hashchange", () => { if(currentUser && location.hash.startsWith("#sms=")) openSmsFromHash(); });

function openSmsSheet(p, opts){

  smsForm = { p, party, client: client ? client.id : "", pay: "Full", guess: suggestCat(p), inboxId: opts.inboxId || null, when };

  openSheet(`
    <div class="sheet-h"><h2>${opts.inboxId && Date.now() - when > 120e3 ? "Review payment" : isIn ? "Money received" : "New payment"}</h2><button class="x" onclick="closeSheet()" aria-label="Close">✕</button></div>

    <div class="amount" style="border-bottom:0;padding-bottom:0"><span>₹</span><input id="sAmt" type="text" inputmode="decimal" value="${esc(p.amount)}" style="color:${isIn ? "var(--green)" : "var(--text)"}"></div>

    ${isIn && clients.length ? `<div class="row2">
      <label class="field"><span>Client</span><select class="input" id="sClient" onchange="smsForm.client=this.value"><option value="">No client</option>${clients.map(c => `<option value="${esc(c.id)}" ${smsForm.client === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>

  paintSmsCats();
}
function paintSmsCats(){
  const f = smsForm, list = f.p.type === "Income" ? IN_CATS : OUT_CATS;
  const sug = f.guess && f.guess !== "Other" ? f.guess : "";
  $("sCats").innerHTML = list.map(([n, ic]) => `<button class="cat ${n === sug ? "on" : ""}" onclick="pickSmsCat(${esc(JSON.stringify(n))})"><span class="em">${ic}</span>${esc(n)}${n === sug ? `<small style="color:var(--green);font-size:10px">suggested</small>` : ""}</button>`).join("");
}
function smsNote(){
  const f = smsForm, extra = ($("sNote") && $("sNote").value.trim()) || "";
  return [f.party, extra, f.p.account].filter(Boolean).join(" · ");
}
async function pickSmsCat(cat){
  const f = smsForm, amt = num($("sAmt").value);
  if(!amt){ toast("Enter an amount"); return; }
  const open = owes.filter(o => loanLeft(o) > 0);
  if(cat === "EMI/Debt" && f.p.type !== "Income" && open.length){       // which loan was this?
    $("sLoans").innerHTML = `<div class="field"><span>Which loan did you pay?</span><div class="chips" style="flex-wrap:wrap">
      ${open.map(o => `<button class="chip" onclick="saveSmsLoan('${esc(o.id)}')">${loanKind(o)[1]} ${esc(o.name)}${hasLoanCols && o.emi_amount ? " · " + money(o.emi_amount) : ""}</button>`).join("")}
      <button class="chip" onclick="saveSms('EMI/Debt')">Not one of these</button></div></div>`;
    $("sLoans").scrollIntoView({ behavior: "smooth", block: "end" });
    return;
  }
  await saveSms(cat);
}
async function saveSms(cat){
  const f = smsForm, amt = num($("sAmt").value), isIn = f.p.type === "Income";
  const row = { user_id: currentUser.id, type: f.p.type, cat, amt, note: smsNote() || "From bank SMS",
                client_id: isIn ? (f.client || null) : null, payment_type: isIn ? f.pay : null, created_at: f.when.toISOString() };
  const r = await writeTx("insert", row);
  if(r.error){ toast("Couldn't save: " + r.error.message); return; }
  tx.push(r.data[0]); await removeInbox(inboxIdsFor(f.p.ref, f.inboxId));
  closeSheet(); renderAll();
  toast(`Saved ${money(amt)} · ${cat}`);
}
async function saveSmsLoan(id){
  const o = owes.find(x => x.id === id), f = smsForm, amt = num($("sAmt").value); if(!o) return;
  const ok = await recordLoanPayment(o, Math.min(amt, loanLeft(o)), f.when.toISOString(), [f.party, f.p.account].filter(Boolean).join(" · "));
  if(!ok) return;
  await removeInbox(inboxIdsFor(f.p.ref, f.inboxId));
  closeSheet(); renderAll();
  const nl = loanLeft(o);
  toast(nl > 0 ? `${o.name}: ${money(amt)} paid · ${money(nl)} left` : `${o.name} is fully paid 🎉`);
}
async function dismissSms(){
  await removeInbox(inboxIdsFor(smsForm.p.ref, smsForm.inboxId));
  closeSheet(); renderAll(); toast("Removed from To review");
}

    </ol>
    ${copyRow("URL for Get Contents of URL", SMS_ENDPOINT)}
    ${copyRow("apikey header value", SUPABASE_ANON_KEY, SUPABASE_ANON_KEY.slice(0, 22) + "…")}
    ${copyRow("Site link for the Text action", site + "#sms=")}
    <p class="muted" style="font-size:13px">Test it with a ₹1 UPI payment. If the phone is locked, the payment waits in To review on Home.</p>`);

async function makeSmsKey(){
  const b = crypto.getRandomValues(new Uint8Array(18));
  const key = btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const hash = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(key)))).map(x => x.toString(16).padStart(2, "0")).join("");
  const { error } = await sb.from("inbox_keys").upsert({ user_id: currentUser.id, key_hash: hash, created_at: new Date().toISOString() });
  if(error){ toast("Couldn't create the key: " + error.message); return; }
  openSmsSetup(key);
  toast("Private key created");
}

    let op = "select", payload = null; const filters = [];

      select(){ return api; }, order(){ return api; }, limit(){ return api; },
      insert(p){ op = "insert"; payload = Array.isArray(p) ? p : [p]; return api; },
      update(p){ op = "update"; payload = p; return api; },
      upsert(p){ op = "upsert"; payload = Array.isArray(p) ? p : [p]; return api; },
