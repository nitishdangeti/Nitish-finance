<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitish Finance OS PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#fff;padding:16px}
.wrap{max-width:480px;margin:auto}
.card{background:#111827;border-radius:22px;padding:16px;margin-bottom:16px}
.header{background:linear-gradient(135deg,#065f46,#16a34a);border-radius:28px;padding:20px;margin-bottom:16px}
input,select,button{width:100%;padding:14px;border:none;border-radius:12px;margin:8px 0;font-size:16px}
input,select{background:#1f2937;color:#fff}
button{background:#16a34a;color:#fff;font-weight:bold;cursor:pointer}
.item{background:#1f2937;padding:12px;border-radius:12px;margin-top:8px}
.row{display:flex;justify-content:space-between}
.del{background:#7f1d1d;color:#fff;width:auto;padding:6px 10px;border-radius:8px;font-size:12px;margin-top:8px;font-weight:normal}
.reset{background:#374151;color:#fff;margin-top:4px}
.logout{background:#374151;color:#fff;width:auto;padding:8px 14px;font-size:13px}
.hidden{display:none}
.error{color:#f87171;font-size:13px;margin-top:-4px}
.toplink{background:none;color:#22c55e;text-decoration:underline;font-weight:normal;font-size:14px;padding:4px}
.authhead{text-align:center;margin-bottom:8px}
.clientCard{background:#1f2937;padding:12px;border-radius:12px;margin-top:8px}
.pending{color:#f59e0b;font-weight:bold}
.paidfull{color:#22c55e;font-weight:bold}
.tag{display:inline-block;background:#065f46;color:#a7f3d0;font-size:11px;padding:2px 8px;border-radius:8px;margin-top:6px}
.bar{background:#374151;border-radius:8px;height:8px;margin-top:8px;overflow:hidden}
.barfill{background:#22c55e;height:100%}
.owesCard{background:#1f2937;padding:12px;border-radius:12px;margin-top:8px}
.owebarfill{background:#f59e0b;height:100%}
.repayBtn{background:#065f46;width:auto;padding:8px 12px;font-size:13px;font-weight:normal;margin-top:8px}

/* ---------- Tab bar ---------- */
.tabbar{display:flex;gap:8px;margin-bottom:16px}
.tabbtn{flex:1;background:#111827;color:#9ca3af;font-weight:bold;padding:12px;border-radius:14px;margin:0;border:1px solid #1f2937}
.tabbtn.active{background:#16a34a;color:#fff;border-color:#16a34a}
.tabpanel{display:none}
.tabpanel.active{display:block}
.empty{opacity:.6;font-size:14px;text-align:center;padding:20px 0}

/* ---------- Desktop / laptop layout ---------- */
@media (min-width: 900px){
  body{padding:32px}
  #authScreen.card{max-width:420px;margin:80px auto}
  .wrap{max-width:1100px}
  .header{margin-bottom:20px}
  .tabbar{max-width:520px;margin:0 auto 20px auto}
  #panels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    align-items:start;
  }
  #panel-overview.active{grid-column:1 / -1}
  button:hover{opacity:0.9}
}
</style>
</head>
<body>
<div class="wrap">

<!-- AUTH SCREEN -->
<div id="authScreen" class="card">
  <div class="authhead">
